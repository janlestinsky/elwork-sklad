<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELWORK Sklad</title>
<meta name="theme-color" content="#ffffff" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Téma pred vykreslením, aby stránka nezablikala
  (function () {
    var t = null;
    try { t = localStorage.getItem('sklad-theme'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <img class="logo logo-light-theme" src="logo-dark.png" alt="ELWORK" width="640" height="102">
    <img class="logo logo-dark-theme" src="logo-light.png" alt="ELWORK" width="640" height="102">
  </div>

  <div class="sync">
    <div class="sync-text">
      <span class="muted">Sklad načítaný</span>
      <strong id="loadedAt">ešte nenačítaný</strong>
    </div>
    <button id="reloadBtn" class="btn-primary" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span id="reloadLabel">Načítať sklad</span>
    </button>
  </div>

  <div class="theme-toggle" role="group" aria-label="Režim zobrazenia">
    <button type="button" data-set-theme="light" aria-label="Svetlý režim">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" data-set-theme="dark" aria-label="Tmavý režim">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="layout">
  <section class="scan-col">
    <div class="camera" id="camera">
      <video id="video" playsinline muted autoplay></video>
      <div class="frame" aria-hidden="true">
        <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
        <i class="laser"></i>
      </div>
      <span class="chip" id="camChip"><span class="dot"></span><span id="camStatus">Kamera vypnutá</span></span>
      <span class="cam-hint" id="camHint">Namierte kameru na čiarový kód</span>
      <button type="button" class="torch" id="torchBtn" aria-label="Svetlo" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
      </button>
      <button type="button" class="cam-start" id="camStart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Zapnúť kameru
      </button>
    </div>

    <form class="search" id="searchForm" autocomplete="off">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" inputmode="numeric" enterkeyhint="search" placeholder="Číslo karty alebo EAN" aria-label="Číslo karty alebo EAN">
      <button type="submit" class="btn-soft">Hľadať</button>
    </form>
    <p class="wedge-hint">Funguje aj s pripojenou USB / Bluetooth čítačkou.</p>
  </section>

  <section class="result-col" id="result" aria-live="polite"></section>
</main>

<footer class="foot">ELWORK Sklad · verzia <span id="appVersion"></span> · <button type="button" class="link-btn" id="changeKey">Zmeniť kód predajne</button></footer>

<div class="toast" id="toast" role="status" hidden></div>

<dialog class="dlg" id="keyDialog" aria-labelledby="keyTitle">
  <form id="keyForm" autocomplete="off">
    <h2 id="keyTitle">Kód predajne</h2>
    <p id="keyMsg">Zadajte kód predajne. Na tomto zariadení sa zadáva len raz.</p>
    <input id="keyInput" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Kód predajne">
    <div class="dlg-actions">
      <button type="button" class="btn-soft" id="keyCancel">Zrušiť</button>
      <button type="submit" class="btn-primary">Uložiť</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
